<!DOCTYPE html>
<html>
<head>
    <title>Turmas</title>
</head>
<body>

    <h1>Grade de Turmas</h1>

    <a href="/">Voltar para o início</a>

    <hr>

    {% for turma in turmas %}

        <p>
            Modalidade: {{ turma.modalidade }}
            <br>

            Dia: {{ turma.dia_semana }}
            <br>

            Horário: {{ turma.horario }}
            <br>

            Instrutor: {{ turma.instrutor }}
            <br>

            Vagas: {{ turma.vagas }}
        </p>

        <hr>

    {% endfor %}

</body>
</html>
